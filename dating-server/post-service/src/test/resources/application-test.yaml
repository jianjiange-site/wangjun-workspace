spring:
  datasource:
    url: jdbc:h2:mem:post_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    init-sqls: CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

dating:
  cache:
    key-prefix: "wangjun:post:"
  object-storage:
    provider: s3
    endpoint: http://localhost:9000
    region: us-east-1
    path-style-access: true
    bucket: wangjun-dating
    access-key: test-access-key
    secret-key: test-secret-key
    upload-url-ttl: 10m
    temp-retention: 24h
  grpc:
    server-port: 9091
    server-enabled: false
    client-deadline: 3s
    profile-service-name: wangjun-profile-service

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
