spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:mobile_gateway_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false

server:
  port: 0

gateway:
  redis:
    key-prefix: dating:mobile-gateway-test
  id-generator:
    worker-id: 1
    datacenter-id: 1
  hash:
    version: 1
    phone-secret: test-phone-secret
    google-subject-secret: test-google-secret
    device-secret: test-device-secret
    refresh-token-secret: test-refresh-secret
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - X-Trace-Id
    allow-credentials: true
    max-age-seconds: 3600
  rate-limit:
    enabled: false
    window-seconds: 60
    max-requests: 3
    fail-open: true
  sms:
    code-ttl-seconds: 300
    cooldown-seconds: 60
    fail-ttl-seconds: 900
    max-verify-failures: 5
  google:
    client-id: test-google-client-id
    jwks-uri: http://127.0.0.1:18080/oauth2/v3/certs
    jwks-cache-ttl-seconds: 43200
    http-timeout-ms: 1000
  grpc:
    user-service:
      service-id: user-service
      discovery-enabled: false
      host: localhost
      port: 9090
      deadline-ms: 100
  jwt:
    issuer: dating-mobile-gateway-test
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
